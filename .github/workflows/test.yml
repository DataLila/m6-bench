name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  harness:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.9 compatibility (the stock macOS python3)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
